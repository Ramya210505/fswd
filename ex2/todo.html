<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flow — Todo List</title>
<meta name="description" content="A fast, animated todo app with priorities, categories, due dates and drag-to-reorder." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="todo.css" />
</head>
<body>

<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>

<div class="app">

  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span>Flow</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <span id="themeIcon">☾</span>
    </button>
  </header>

  <!-- ===== Progress ring + stats ===== -->
  <section class="summary">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 120 120">
        <circle class="ring-track" cx="60" cy="60" r="52"></circle>
        <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52"></circle>
      </svg>
      <div class="ring-label">
        <span id="ringPercent">0%</span>
        <small>done today</small>
      </div>
    </div>

    <div class="summary-stats">
      <div class="stat-pill"><strong id="statTotal">0</strong><span>Total</span></div>
      <div class="stat-pill"><strong id="statActive">0</strong><span>Active</span></div>
      <div class="stat-pill"><strong id="statDone">0</strong><span>Done</span></div>
      <div class="stat-pill stat-pill--warn"><strong id="statOverdue">0</strong><span>Overdue</span></div>
    </div>
  </section>

  <!-- ===== Quick add ===== -->
  <form class="add-form" id="addForm">
    <input type="text" id="taskInput" placeholder="Add a task and hit Enter…" autocomplete="off" required />

    <select id="prioritySelect" title="Priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>

    <select id="categorySelect" title="Category">
      <option value="personal">Personal</option>
      <option value="work">Work</option>
      <option value="study">Study</option>
      <option value="health">Health</option>
    </select>

    <input type="date" id="dueInput" title="Due date" />

    <button type="submit" class="add-btn">Add <span>＋</span></button>
  </form>

  <!-- ===== Filters ===== -->
  <div class="filters">
    <div class="filter-group" id="statusFilters">
      <button class="chip is-active" data-filter="all">All</button>
      <button class="chip" data-filter="active">Active</button>
      <button class="chip" data-filter="completed">Completed</button>
      <button class="chip" data-filter="overdue">Overdue</button>
    </div>

    <div class="filter-right">
      <select id="sortSelect" title="Sort by">
        <option value="manual">Manual order</option>
        <option value="priority">Priority</option>
        <option value="due">Due date</option>
        <option value="alpha">A–Z</option>
      </select>
      <div class="search-box">
        <span>⌕</span>
        <input type="text" id="searchInput" placeholder="Search tasks…" />
      </div>
    </div>
  </div>

  <div class="category-filters" id="categoryFilters">
    <button class="tag-chip is-active" data-category="all">All categories</button>
    <button class="tag-chip" data-category="personal">Personal</button>
    <button class="tag-chip" data-category="work">Work</button>
    <button class="tag-chip" data-category="study">Study</button>
    <button class="tag-chip" data-category="health">Health</button>
  </div>

  <!-- ===== List ===== -->
  <ul class="task-list" id="taskList" aria-live="polite"></ul>

  <div class="empty-state" id="emptyState">
    <div class="empty-illustration">✓</div>
    <h3>Nothing here</h3>
    <p id="emptyText">Add your first task above to get started.</p>
  </div>

  <div class="list-footer" id="listFooter">
    <span id="remainingText">0 tasks left</span>
    <button class="clear-btn" id="clearCompleted">Clear completed</button>
  </div>

</div>

<!-- Confetti canvas for the "all done" celebration -->
<canvas id="confettiCanvas"></canvas>

<div class="toast" id="toast"></div>

<script src="todo.js"></script>
</body>
</html>
