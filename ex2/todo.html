<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow | Advanced Kanban</title>
    <link rel="stylesheet" href="todo.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo"><div class="logo-icon"><i class="fas fa-layer-group"></i></div> TaskFlow</div>
            <div class="nav-menu">
                <a href="#" class="nav-item active"><i class="fas fa-th-large"></i> Board View</a>
            </div>
            <!-- Live Progress Bar -->
            <div class="storage-metrics">
                <div class="metrics-header"><span>Task Completion</span><span id="completion-pct">0%</span></div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="completion-fill"></div></div>
            </div>
        </aside>

        <!-- Main Kanban Board Area -->
        <main class="main-content">
            <header class="topbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search tasks...">
                </div>
            </header>

            <div class="board-header">
                <div><h1>Product Engineering</h1><p class="subtitle">Drag and drop tasks to change their status.</p></div>
                <button class="btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Create Task</button>
            </div>

            <div class="kanban-board">
                <!-- Columns -->
                <div class="kanban-column" data-status="todo">
                    <div class="column-header">To Do <span id="count-todo">0</span></div>
                    <div class="task-list" id="list-todo"></div>
                </div>
                <div class="kanban-column" data-status="inprogress">
                    <div class="column-header">In Progress <span id="count-inprogress">0</span></div>
                    <div class="task-list" id="list-inprogress"></div>
                </div>
                <div class="kanban-column" data-status="done">
                    <div class="column-header">Done <span id="count-done">0</span></div>
                    <div class="task-list" id="list-done"></div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="todo.js"></script>
</body>
</html>
