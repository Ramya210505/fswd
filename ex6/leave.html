<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voxel — Online Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stles.css" />
</head>
<body>

<div class="bg-gradient"></div>

<div class="app-wrap">

  <!-- Intro -->
  <section class="card intro-card" id="introCard">
    <span class="eyebrow">Frontend Projects Feedback</span>
    <h1>Tell us what you think</h1>
    <p>5 quick questions, about a minute. Your answers help shape what gets built next.</p>
    <button class="primary-btn" id="startBtn">Start survey →</button>
    <button class="ghost-btn" id="viewResultsBtn">View results so far</button>
  </section>

  <!-- Survey -->
  <section class="card survey-card" id="surveyCard" hidden>
    <div class="step-dots" id="stepDots"></div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="step-label"><span id="stepNum">1</span> / <span id="stepTotal">5</span></div>

    <div class="question-wrap" id="questionWrap"></div>

    <div class="nav-row">
      <button class="ghost-btn" id="backBtn">← Back</button>
      <button class="primary-btn" id="nextBtn">Next →</button>
    </div>
  </section>

  <!-- Thank you -->
  <section class="card done-card" id="doneCard" hidden>
    <div class="done-icon">🎉</div>
    <h1>Thanks for the feedback!</h1>
    <p>Your response has been recorded.</p>
    <button class="primary-btn" id="seeResultsBtn">See aggregated results</button>
    <button class="ghost-btn" id="restartBtn">Take survey again</button>
  </section>

  <!-- Results -->
  <section class="card results-card" id="resultsCard" hidden>
    <div class="results-head">
      <h1>Results so far</h1>
      <span id="responseCount" class="response-count">0 responses</span>
    </div>
    <div id="resultsBody"></div>
    <button class="ghost-btn" id="backHomeBtn">← Back to start</button>
  </section>

</div>

<canvas id="confettiCanvas"></canvas>
<script src="script.js"></script>
</body>
</html>
